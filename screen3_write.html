<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>감자 마켓 - 상품 등록</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-brown: #8c5828;
      --primary-hover: #73451e;
      --accent-brown: #b07d4b;
      --warm-bg: #fdfaf6;
      --card-bg: #ffffff;
      --border-color: #ecdccf;
      --border-focus: #b07d4b;
      --text-main: #2e261f;
      --text-muted: #7d7268;
      --text-light: #a99d91;
      --error-color: #e5484d;
      --badge-free: #e67e22;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --shadow-modal: 0 20px 40px rgba(74, 48, 24, 0.16);
      --shadow-sm: 0 2px 6px rgba(74, 48, 24, 0.05);
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--warm-bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 단독 테스트용 데모 레이아웃 */
    .demo-container {
      max-width: 640px;
      margin: 40px auto;
      padding: 24px;
      width: 92%;
    }

    .demo-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .demo-brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 26px;
      font-weight: 700;
      color: var(--primary-brown);
      margin-bottom: 8px;
    }

    .demo-brand .potato-icon {
      font-size: 32px;
      animation: bounce 2s infinite ease-in-out;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .demo-subtitle {
      color: var(--text-muted);
      font-size: 15px;
    }

    .demo-action-box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 28px;
      text-align: center;
      box-shadow: var(--shadow-sm);
      margin-bottom: 28px;
    }

    .demo-btn-open {
      background: linear-gradient(135deg, var(--accent-brown) 0%, var(--primary-brown) 100%);
      color: #fff;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 6px 16px rgba(140, 88, 40, 0.28);
      transition: var(--transition);
    }

    .demo-btn-open:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(140, 88, 40, 0.36);
    }

    .demo-result-header {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .demo-product-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .demo-product-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 14px;
      display: flex;
      gap: 16px;
      align-items: center;
      box-shadow: var(--shadow-sm);
      animation: fadeIn 0.3s ease;
    }

    .demo-product-card img {
      width: 76px;
      height: 76px;
      border-radius: var(--radius-sm);
      object-fit: cover;
      background: #f5ede4;
      flex-shrink: 0;
    }

    .demo-product-info {
      flex: 1;
      min-width: 0;
    }

    .demo-product-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .demo-product-meta {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .demo-product-price {
      font-size: 16px;
      font-weight: 700;
      color: var(--primary-brown);
    }

    .demo-status-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      display: inline-block;
      margin-right: 6px;
    }

    .status-sale { background: #eaf6ea; color: #2e7d32; }
    .status-reserved { background: #fff4e5; color: #d97706; }
    .status-done { background: #eee; color: #757575; }

    /* ========================================= */
    /* [화면 3] 글쓰기 모달 / 폼 스타일 */
    /* ========================================= */
    .gamza-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(30, 22, 14, 0.45);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
      padding: 16px;
    }

    .gamza-modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .gamza-modal-wrapper {
      background: var(--card-bg);
      width: 100%;
      max-width: 540px;
      max-height: 90vh;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-modal);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: translateY(24px) scale(0.98);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      border: 1px solid var(--border-color);
    }

    .gamza-modal-overlay.active .gamza-modal-wrapper {
      transform: translateY(0) scale(1);
    }

    /* 모달 헤더 */
    .modal-header {
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      background-color: var(--warm-bg);
    }

    .modal-header-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary-brown);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-close-btn {
      background: none;
      border: none;
      font-size: 22px;
      color: var(--text-muted);
      cursor: pointer;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .modal-close-btn:hover {
      background: #eee5db;
      color: var(--text-main);
    }

    /* 모달 바디 (스크롤 영역) */
    .modal-body {
      padding: 24px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* 커스텀 스크롤바 */
    .modal-body::-webkit-scrollbar {
      width: 6px;
    }
    .modal-body::-webkit-scrollbar-thumb {
      background: #decbbd;
      border-radius: 10px;
    }
    .modal-body::-webkit-scrollbar-track {
      background: transparent;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
    }

    .form-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .form-label .required {
      color: var(--error-color);
      font-size: 14px;
    }

    .form-label .hint-text {
      font-size: 12px;
      color: var(--text-light);
      font-weight: 400;
      margin-left: auto;
    }

    /* 이미지 업로드/미리보기 섹션 */
    .image-upload-container {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      margin-top: 4px;
    }

    .image-preview-box {
      width: 108px;
      height: 108px;
      border: 2px dashed var(--border-color);
      border-radius: var(--radius-md);
      position: relative;
      background: var(--warm-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      flex-shrink: 0;
      transition: var(--transition);
    }

    .image-preview-box:hover {
      border-color: var(--accent-brown);
      background: #f7efe6;
    }

    .image-preview-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .image-placeholder-icon {
      font-size: 30px;
      margin-bottom: 4px;
    }

    .image-placeholder-text {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .image-badge-tag {
      position: absolute;
      bottom: 4px;
      left: 4px;
      right: 4px;
      font-size: 9px;
      background: rgba(140, 88, 40, 0.85);
      color: white;
      text-align: center;
      padding: 2px 0;
      border-radius: 4px;
    }

    .image-inputs-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      justify-content: center;
    }

    .file-input-hidden {
      display: none;
    }

    .btn-file-trigger {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--border-color);
      background: #fff;
      color: var(--primary-brown);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-file-trigger:hover {
      background: #f9f4ee;
      border-color: var(--accent-brown);
    }

    .url-input-wrapper {
      position: relative;
    }

    .url-input-wrapper input {
      padding-left: 28px;
      font-size: 13px;
    }

    .url-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      color: var(--text-light);
    }

    /* 인풋 공통 스타일 */
    .form-input,
    .form-select,
    .form-textarea {
      width: 100%;
      padding: 12px 14px;
      font-size: 14px;
      color: var(--text-main);
      background-color: #fff;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-sm);
      outline: none;
      transition: var(--transition);
    }

    .form-input:focus,
    .form-select:focus,
    .form-textarea:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(176, 125, 75, 0.15);
    }

    .form-input::placeholder,
    .form-textarea::placeholder {
      color: var(--text-light);
    }

    .form-input.error,
    .form-select.error,
    .form-textarea.error {
      border-color: var(--error-color);
      background-color: #fffaf9;
    }

    .error-msg {
      font-size: 12px;
      color: var(--error-color);
      display: none;
      margin-top: 2px;
    }

    .error-msg.visible {
      display: block;
    }

    /* 가격 입력 필드 보조 */
    .price-input-container {
      position: relative;
    }

    .price-unit-tag {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      pointer-events: none;
    }

    .price-helper-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      margin-top: 4px;
      color: var(--text-muted);
    }

    .free-share-badge {
      background: #fff0df;
      color: var(--badge-free);
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      display: none;
    }

    /* 상태 라디오 버튼 그룹 */
    .status-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .status-option {
      position: relative;
      cursor: pointer;
    }

    .status-option input {
      position: absolute;
      opacity: 0;
      cursor: pointer;
    }

    .status-option-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-muted);
      background: #fff;
      transition: var(--transition);
      user-select: none;
    }

    .status-option input:checked + .status-option-label {
      border-color: var(--primary-brown);
      background-color: #f7ede3;
      color: var(--primary-brown);
      font-weight: 700;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .dot-sale { background-color: #2e7d32; }
    .dot-reserved { background-color: #d97706; }
    .dot-done { background-color: #757575; }

    /* 텍스트에어리어 */
    .form-textarea {
      min-height: 120px;
      resize: vertical;
      line-height: 1.5;
    }

    /* 모달 풋터 (액션 버튼) */
    .modal-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 12px;
      background: #fff;
    }

    .btn-cancel {
      flex: 1;
      padding: 13px;
      background: #f4ede5;
      color: var(--text-muted);
      border: none;
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-cancel:hover {
      background: #e9dec6;
      color: var(--text-main);
    }

    .btn-submit {
      flex: 2;
      padding: 13px;
      background: linear-gradient(135deg, #ffe066 0%, #ffc107 100%);
      color: #3c2008;
      border: 1px solid rgba(255, 179, 0, 0.4);
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(255, 193, 7, 0.45);
      transition: var(--transition);
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, #ffd54f 0%, #ffb300 100%);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(255, 193, 7, 0.55);
    }

    /* 모바일 반응형 (화면 아래에서 올라오는 바텀시트 느낌) */
    @media (max-width: 600px) {
      .gamza-modal-overlay {
        padding: 0;
        align-items: flex-end;
      }

      .gamza-modal-wrapper {
        max-width: 100%;
        max-height: 88vh;
        border-bottom-left-radius: 0;
        border-bottom-right-radius: 0;
        transform: translateY(100%);
      }

      .gamza-modal-overlay.active .gamza-modal-wrapper {
        transform: translateY(0);
      }

      .modal-body {
        padding: 20px 16px;
      }

      .modal-footer {
        padding: 14px 16px;
      }
    }

    /* 토스트 알림 */
    .gamza-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(50px);
      background: rgba(46, 38, 31, 0.9);
      color: #fff;
      padding: 12px 22px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 500;
      z-index: 1200;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    .gamza-toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- ============================================== -->
  <!-- [단독 테스트용 프리뷰 컨테이너] -->
  <!-- ============================================== -->
  <div class="demo-container">
    <div class="demo-header">
      <div class="demo-brand">
        <span class="potato-icon">🥔</span>
        <span>감자 마켓</span>
      </div>
      <p class="demo-subtitle">[화면 3] 상품 등록(글쓰기) 모달 컴포넌트 단독 테스트</p>
    </div>

    <div class="demo-action-box">
      <h3 style="font-size: 16px; margin-bottom: 12px; color: var(--text-main);">이웃과 나누고 싶은 물건이 있나요?</h3>
      <p style="font-size: 13.5px; color: var(--text-muted); margin-bottom: 18px;">따뜻한 감자 마켓에 손쉽게 글을 등록해보세요.</p>
      <button class="demo-btn-open" onclick="window.openWriteModal()">
        <span>✏️</span> 새 상품 등록하기 (모달 열기)
      </button>
    </div>

    <div>
      <div class="demo-result-header">
        <span>최근 등록된 상품 미리보기</span>
        <span id="demoTotalCount" style="font-size: 13px; font-weight: normal; color: var(--text-muted);">0개 등록됨</span>
      </div>
      <div class="demo-product-list" id="demoProductList">
        <!-- 등록된 상품이 여기에 카드 형태로 추가됩니다 -->
      </div>
    </div>
  </div>

  <!-- ============================================== -->
  <!-- [화면 3] 글쓰기 모달 템플릿 영역 -->
  <!-- ============================================== -->
  <div class="gamza-modal-overlay" id="writeModalOverlay">
    <div class="gamza-modal-wrapper" role="dialog" aria-modal="true" aria-labelledby="writeModalTitle">
      
      <!-- 모달 헤더 -->
      <div class="modal-header">
        <div class="modal-header-title" id="writeModalTitle">
          <span>🥔</span>
          <span>내 물건 팔기 / 등록하기</span>
        </div>
        <button type="button" class="modal-close-btn" id="btnCloseModalX" title="닫기" aria-label="닫기">✕</button>
      </div>

      <!-- 모달 폼 본문 -->
      <form id="writeProductForm" class="modal-body" onsubmit="event.preventDefault();">
        
        <!-- 1. 상품 이미지 첨부 & 미리보기 -->
        <div class="form-group">
          <label class="form-label">
            <span>상품 이미지</span>
            <span class="hint-text">미등록 시 귀여운 기본 감자 이미지가 적용돼요</span>
          </label>
          <div class="image-upload-container">
            <!-- 미리보기 박스 -->
            <div class="image-preview-box" id="imagePreviewBox" title="클릭하여 파일 선택">
              <img id="imagePreview" class="image-preview-img" alt="미리보기">
              <div id="imagePlaceholder" style="text-align: center;">
                <div class="image-placeholder-icon">📷</div>
                <div class="image-placeholder-text">사진 선택</div>
              </div>
              <span id="imageSourceTag" class="image-badge-tag" style="display: none;">파일</span>
            </div>

            <div class="image-inputs-col">
              <!-- 파일 업로드 트리거 -->
              <input type="file" id="productImageFile" class="file-input-hidden" accept="image/*">
              <button type="button" class="btn-file-trigger" id="btnSelectFile">
                <span>📁</span> 내 컴퓨터/모바일에서 사진 찾기
              </button>

              <!-- 또는 이미지 URL 직접 입력 -->
              <div class="url-input-wrapper">
                <span class="url-icon">🔗</span>
                <input type="url" id="productImageUrl" class="form-input" placeholder="또는 웹 이미지 URL 붙여넣기">
              </div>
            </div>
          </div>
        </div>

        <!-- 2. 상품명 -->
        <div class="form-group">
          <label class="form-label" for="productTitle">
            <span>상품명</span>
            <span class="required">*</span>
          </label>
          <input type="text" id="productTitle" class="form-input" placeholder="글 제목 또는 상품명을 입력하세요" maxlength="50" autocomplete="off">
          <div class="error-msg" id="errTitle">상품명을 입력해주세요 (최소 2글자 이상)</div>
        </div>

        <!-- 3. 카테고리 -->
        <div class="form-group">
          <label class="form-label" for="productCategory">
            <span>카테고리</span>
            <span class="required">*</span>
          </label>
          <select id="productCategory" class="form-select">
            <option value="" disabled selected>카테고리를 선택해주세요</option>
            <option value="디지털기기">디지털기기</option>
            <option value="가구/인테리어">가구/인테리어</option>
            <option value="의류">의류</option>
            <option value="생활가전">생활가전</option>
            <option value="도서/티켓">도서/티켓</option>
            <option value="기타">기타</option>
          </select>
          <div class="error-msg" id="errCategory">카테고리를 선택해주세요</div>
        </div>

        <!-- 4. 가격 -->
        <div class="form-group">
          <label class="form-label" for="productPrice">
            <span>판매 가격</span>
            <span class="required">*</span>
          </label>
          <div class="price-input-container">
            <input type="number" id="productPrice" class="form-input" placeholder="0" min="0" step="100">
            <span class="price-unit-tag">원</span>
          </div>
          <div class="price-helper-row">
            <span id="priceFormatted">0원</span>
            <span id="freeShareBadge" class="free-share-badge">🧡 따뜻한 나눔 상품</span>
          </div>
          <div class="error-msg" id="errPrice">가격을 입력해주세요 (무료 나눔은 0원)</div>
        </div>

        <!-- 5. 거래 희망 동네 -->
        <div class="form-group">
          <label class="form-label" for="productLocation">
            <span>거래 동네</span>
            <span class="required">*</span>
          </label>
          <input type="text" id="productLocation" class="form-input" placeholder="예: 역삼동, 한남동, 판교동 등" maxlength="20">
          <div class="error-msg" id="errLocation">거래를 원하는 동네를 입력해주세요</div>
        </div>

        <!-- 6. 판매 상태 -->
        <div class="form-group">
          <label class="form-label">
            <span>판매 상태</span>
          </label>
          <div class="status-group">
            <label class="status-option">
              <input type="radio" name="productStatus" value="판매중" checked>
              <span class="status-option-label">
                <span class="status-dot dot-sale"></span> 판매중
              </span>
            </label>
            <label class="status-option">
              <input type="radio" name="productStatus" value="예약중">
              <span class="status-option-label">
                <span class="status-dot dot-reserved"></span> 예약중
              </span>
            </label>
            <label class="status-option">
              <input type="radio" name="productStatus" value="거래 완료">
              <span class="status-option-label">
                <span class="status-dot dot-done"></span> 거래 완료
              </span>
            </label>
          </div>
        </div>

        <!-- 7. 자세한 설명 -->
        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label class="form-label" for="productDescription" style="margin-bottom: 0;">
              <span>자세한 설명</span>
              <span class="required">*</span>
            </label>
            <span style="font-size: 12px; color: var(--text-muted);"><span id="descCharCount" style="color: var(--primary-brown); font-weight: 700;">0</span> / 500자</span>
          </div>
          <textarea id="productDescription" class="form-textarea" maxlength="500" placeholder="신뢰할 수 있는 거래를 위해 구매 시기, 사용감, 하자 여부 등을 솔직하게 작성해주세요. (최대 500자까지 작성 가능해요 🥔)"></textarea>
          <div class="error-msg" id="errDescription">상세 설명을 최소 5자 이상 적어주세요 (최대 500자)</div>
        </div>

      </form>

      <!-- 모달 하단 버튼 -->
      <div class="modal-footer">
        <button type="button" class="btn-cancel" id="btnCancelModal">취소</button>
        <button type="button" class="btn-submit" id="btnSubmitForm">
          <span>🥔</span> 작성 완료
        </button>
      </div>

    </div>
  </div>

  <!-- 토스트 메시지 -->
  <div class="gamza-toast" id="gamzaToast">알림 메시지</div>

  <!-- ============================================== -->
  <!-- JavaScript 로직 -->
  <!-- ============================================== -->
  <script>
    (function() {
      // 기본 감자 일러스트 (SVG Data URI) - 이미지 미입력 시 디폴트 적용
      const DEFAULT_POTATO_IMG = 'data:image/svg+xml;utf8,' + encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
          <rect width="200" height="200" fill="#fdf8f2" rx="20"/>
          <!-- 감자 몸통 -->
          <path d="M50 100 C 40 60, 90 40, 140 55 C 175 65, 170 120, 150 150 C 130 175, 70 170, 50 145 C 38 130, 45 115, 50 100 Z" fill="#d2a679" stroke="#8c5828" stroke-width="5"/>
          <!-- 감자 반점 -->
          <circle cx="75" cy="75" r="4" fill="#a47244"/>
          <circle cx="120" cy="70" r="3.5" fill="#a47244"/>
          <circle cx="145" cy="115" r="4" fill="#a47244"/>
          <circle cx="85" cy="145" r="3.5" fill="#a47244"/>
          <!-- 귀여운 눈과 볼터치 -->
          <circle cx="85" cy="105" r="5" fill="#3b2b1a"/>
          <circle cx="125" cy="105" r="5" fill="#3b2b1a"/>
          <circle cx="75" cy="116" r="6" fill="#f5a3a3" opacity="0.7"/>
          <circle cx="135" cy="116" r="6" fill="#f5a3a3" opacity="0.7"/>
          <!-- 미소 -->
          <path d="M 100 114 Q 105 125 110 114" stroke="#3b2b1a" stroke-width="3" fill="none" stroke-linecap="round"/>
          <!-- 새싹 싹트기 -->
          <path d="M 105 48 C 103 35, 115 30, 120 38 C 122 45, 115 48, 105 48 Z" fill="#7cb342"/>
          <path d="M 105 48 Q 103 40, 98 44" stroke="#558b2f" stroke-width="2" fill="none"/>
        </svg>
      `);

      // DOM 요소 캐싱
      const overlay = document.getElementById('writeModalOverlay');
      const form = document.getElementById('writeProductForm');
      const btnCloseX = document.getElementById('btnCloseModalX');
      const btnCancel = document.getElementById('btnCancelModal');
      const btnSubmit = document.getElementById('btnSubmitForm');
      const toast = document.getElementById('gamzaToast');

      // 폼 필드
      const inputTitle = document.getElementById('productTitle');
      const selectCategory = document.getElementById('productCategory');
      const inputPrice = document.getElementById('productPrice');
      const priceFormatted = document.getElementById('priceFormatted');
      const freeShareBadge = document.getElementById('freeShareBadge');
      const inputLocation = document.getElementById('productLocation');
      const textareaDesc = document.getElementById('productDescription');
      
      // 이미지 관련 필드
      const inputFile = document.getElementById('productImageFile');
      const inputUrl = document.getElementById('productImageUrl');
      const btnSelectFile = document.getElementById('btnSelectFile');
      const previewBox = document.getElementById('imagePreviewBox');
      const previewImg = document.getElementById('imagePreview');
      const placeholder = document.getElementById('imagePlaceholder');
      const imageTag = document.getElementById('imageSourceTag');

      // 에러 메시지
      const errTitle = document.getElementById('errTitle');
      const errCategory = document.getElementById('errCategory');
      const errPrice = document.getElementById('errPrice');
      const errLocation = document.getElementById('errLocation');
      const errDesc = document.getElementById('errDescription');

      let currentImageDataUrl = '';

      // 토스트 메시지 띄우기
      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => {
          toast.classList.remove('show');
        }, 2600);
      }

      // 모달 열기 인터페이스 (외부에서 호출 가능)
      window.openWriteModal = function() {
        overlay.classList.add('active');
        document.body.style.overflow = 'hidden'; // 배경 스크롤 방지
        setTimeout(() => inputTitle.focus(), 150);
      };

      // 모달 닫기
      window.closeWriteModal = function() {
        overlay.classList.remove('active');
        document.body.style.overflow = '';
        resetForm();
      };

      // 폼 초기화
      function resetForm() {
        form.reset();
        currentImageDataUrl = '';
        previewImg.src = '';
        previewImg.style.display = 'none';
        placeholder.style.display = 'block';
        imageTag.style.display = 'none';
        priceFormatted.textContent = '0원';
        freeShareBadge.style.display = 'none';

        // 라디오 기본값 리셋
        const defaultRadio = document.querySelector('input[name="productStatus"][value="판매중"]');
        if (defaultRadio) defaultRadio.checked = true;

        // 에러 상태 리셋
        clearErrors();

        // 글자수 카운터 리셋
        const descCharCountEl = document.getElementById('descCharCount');
        if (descCharCountEl) {
          descCharCountEl.textContent = '0';
          descCharCountEl.style.color = 'var(--primary-brown)';
        }
      }

      function clearErrors() {
        [inputTitle, selectCategory, inputPrice, inputLocation, textareaDesc].forEach(el => {
          el.classList.remove('error');
        });
        [errTitle, errCategory, errPrice, errLocation, errDesc].forEach(el => {
          el.classList.remove('visible');
        });
      }

      // 닫기 이벤트 바인딩
      btnCloseX.addEventListener('click', window.closeWriteModal);
      btnCancel.addEventListener('click', window.closeWriteModal);
      overlay.addEventListener('click', function(e) {
        if (e.target === overlay) {
          window.closeWriteModal();
        }
      });

      // ESC 키로 닫기
      window.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && overlay.classList.contains('active')) {
          window.closeWriteModal();
        }
      });

      // 이미지 선택 트리거
      previewBox.addEventListener('click', () => inputFile.click());
      btnSelectFile.addEventListener('click', () => inputFile.click());

      // 로컬 파일 업로드 처리
      inputFile.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
          if (!file.type.startsWith('image/')) {
            showToast('⚠️ 이미지 파일만 등록할 수 있습니다.');
            return;
          }
          const reader = new FileReader();
          reader.onload = function(evt) {
            currentImageDataUrl = evt.target.result;
            inputUrl.value = ''; // URL 입력창 비움
            updateImagePreview(currentImageDataUrl, '파일');
          };
          reader.readAsDataURL(file);
        }
      });

      // 이미지 URL 입력 처리 (디바운스/인풋 실시간 반영)
      inputUrl.addEventListener('input', function() {
        const val = this.value.trim();
        if (val) {
          currentImageDataUrl = val;
          inputFile.value = ''; // 파일 선택값 초기화
          updateImagePreview(val, 'URL');
        } else {
          currentImageDataUrl = '';
          updateImagePreview('', '');
        }
      });

      // 이미지 미리보기 업데이트 함수
      function updateImagePreview(src, typeText) {
        if (src) {
          previewImg.src = src;
          previewImg.style.display = 'block';
          placeholder.style.display = 'none';
          if (typeText) {
            imageTag.textContent = typeText;
            imageTag.style.display = 'block';
          }
        } else {
          previewImg.src = '';
          previewImg.style.display = 'none';
          placeholder.style.display = 'block';
          imageTag.style.display = 'none';
        }
      }

      // 가격 서식 및 나눔 뱃지 실시간 표시
      inputPrice.addEventListener('input', function() {
        const val = parseInt(this.value, 10);
        if (isNaN(val) || val === 0) {
          priceFormatted.textContent = '0원 (나눔)';
          freeShareBadge.style.display = 'inline-block';
        } else {
          priceFormatted.textContent = val.toLocaleString() + '원';
          freeShareBadge.style.display = 'none';
        }
      });

      // 상세 설명 실시간 글자수 카운트 & 500자 제한
      const descCharCountEl = document.getElementById('descCharCount');
      textareaDesc.addEventListener('input', function() {
        let len = this.value.length;
        if (len > 500) {
          this.value = this.value.substring(0, 500);
          len = 500;
          showToast('⚠️ 상세 설명은 최대 500자까지 작성할 수 있습니다.');
        }
        if (descCharCountEl) {
          descCharCountEl.textContent = len;
          if (len >= 500) {
            descCharCountEl.style.color = '#e5484d';
          } else if (len >= 450) {
            descCharCountEl.style.color = '#e69500';
          } else {
            descCharCountEl.style.color = 'var(--primary-brown)';
          }
        }
      });

      // 유효성 검사 로직
      function validateForm() {
        clearErrors();
        let isValid = true;

        // 1. 제목 체크
        const titleVal = inputTitle.value.trim();
        if (!titleVal || titleVal.length < 2) {
          inputTitle.classList.add('error');
          errTitle.classList.add('visible');
          isValid = false;
        }

        // 2. 카테고리 체크
        if (!selectCategory.value) {
          selectCategory.classList.add('error');
          errCategory.classList.add('visible');
          isValid = false;
        }

        // 3. 가격 체크 (0원 이상 숫자 필수)
        if (inputPrice.value.trim() === '' || isNaN(Number(inputPrice.value)) || Number(inputPrice.value) < 0) {
          inputPrice.classList.add('error');
          errPrice.classList.add('visible');
          isValid = false;
        }

        // 4. 동네 체크
        const locVal = inputLocation.value.trim();
        if (!locVal) {
          inputLocation.classList.add('error');
          errLocation.classList.add('visible');
          isValid = false;
        }

        // 5. 상세 설명 체크 (최소 5자, 최대 500자)
        const descVal = textareaDesc.value.trim();
        if (!descVal || descVal.length < 5 || descVal.length > 500) {
          textareaDesc.classList.add('error');
          errDesc.classList.add('visible');
          isValid = false;
        }

        return isValid;
      }

      // [작성 완료] 처리
      btnSubmit.addEventListener('click', function() {
        if (!validateForm()) {
          showToast('⚠️ 입력 항목을 확인해주세요.');
          return;
        }

        // 선택된 상태값
        const statusSelected = document.querySelector('input[name="productStatus"]:checked');
        const status = statusSelected ? statusSelected.value : '판매중';

        // 최종 이미지 결정 (미입력시 기본 감자 일러스트)
        const finalImage = currentImageDataUrl || DEFAULT_POTATO_IMG;

        // 신규 상품 객체 생성
        const newProduct = {
          id: Date.now(),
          title: inputTitle.value.trim(),
          category: selectCategory.value,
          price: parseInt(inputPrice.value, 10) || 0,
          description: textareaDesc.value.trim(),
          location: inputLocation.value.trim(),
          status: status,
          imageUrl: finalImage,
          createdAt: '방금 전',
          likes: 0,
          chats: 0
        };

        // 외부 콜백 함수 호출 (window.addNewProduct)
        if (typeof window.addNewProduct === 'function') {
          window.addNewProduct(newProduct);
        } else {
          // 외부 콜백이 정의되지 않은 단독 실행 환경 대비 내장 핸들러
          defaultAddNewProduct(newProduct);
        }

        showToast('🥔 감자 마켓에 상품이 등록되었습니다!');
        window.closeWriteModal();
      });

      // 단독 테스트 환경용 기본 콜백 핸들러
      let demoProductCount = 0;
      function defaultAddNewProduct(prod) {
        demoProductCount++;
        document.getElementById('demoTotalCount').textContent = demoProductCount + '개 등록됨';

        const list = document.getElementById('demoProductList');
        const card = document.createElement('div');
        card.className = 'demo-product-card';

        let statusClass = 'status-sale';
        if (prod.status === '예약중') statusClass = 'status-reserved';
        if (prod.status === '거래 완료') statusClass = 'status-done';

        const priceText = prod.price === 0 ? '🧡 무료나눔' : prod.price.toLocaleString() + '원';

        card.innerHTML = `
          <img src="${prod.imageUrl}" alt="${prod.title}">
          <div class="demo-product-info">
            <div class="demo-product-title">${prod.title}</div>
            <div class="demo-product-meta">
              <span class="demo-status-badge ${statusClass}">${prod.status}</span>
              <span>${prod.category}</span> · 
              <span>${prod.location}</span> · 
              <span>${prod.createdAt}</span>
            </div>
            <div class="demo-product-price">${priceText}</div>
          </div>
        `;
        list.prepend(card);
      }

      // 초기 데모 데이터 하나 추가 (시각적 확인용)
      defaultAddNewProduct({
        id: 1,
        title: '포슬포슬 햇감자 5kg (박스 미개봉)',
        category: '기타',
        price: 12000,
        description: '강원도에서 갓 수확한 맛있는 햇감자입니다. 직거래 원해요!',
        location: '역삼동',
        status: '판매중',
        imageUrl: DEFAULT_POTATO_IMG,
        createdAt: '10분 전',
        likes: 3,
        chats: 1
      });

    })();
  </script>
</body>
</html>
